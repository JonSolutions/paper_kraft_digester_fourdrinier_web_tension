# Prometheus Alerting Rules: Kraft Pulp Kamyr Digester H-Factor Kappa Control, Fourdrinier We
# Standard: TAPPI-T236-ISO-536-PAPTAC-QCS-2026
groups:
  - name: "paper_kraft_digester_fourdrinier_web_tension_kamyr_continuous_digest_rules"
    interval: "5s"
    rules:
      - record: "facility:kamyr_continuous_digest_vroom_h_factor_accum:mean5m"
        expr: "avg_over_time(paper_kraft_di_kamyr_continuous_digest_vroom_h_factor_accum[5m])"
        labels:
          subsystem: "IsothermalCookingZone"
          standard: "TAPPI-T236-ISO-536-PAPTAC-QCS-2026"
      - alert: "IsothermalCookingZoneMahalanobisExcursionHigh"
        expr: "paper_kraft_di_kamyr_continuous_digest_mahalanobis_score > 3.5"
        for: "15s"
        labels:
          severity: "warning"
          subsystem: "IsothermalCookingZone"
        annotations:
          summary: "IsothermalCookingZone anomaly score exceeded 3.5 sigma"
          description: "Metric vroom_h_factor_accum drifted from baseline 24.5 (tol 0.35)."
      - alert: "IsothermalCookingZoneSafetyInterlockLatched"
        expr: "paper_kraft_di_kamyr_continuous_digest_interlock_latched == 1"
        for: "1s"
        labels:
          severity: "critical"
          subsystem: "IsothermalCookingZone"
        annotations:
          summary: "CRITICAL: IsothermalCookingZone safety interlock tripped"
          description: "Immediate closed-loop damping actuated on kamyr_continuous_digest."
  - name: "paper_kraft_digester_fourdrinier_web_tension_hydraulic_headbox_slice_rules"
    interval: "5s"
    rules:
      - record: "facility:hydraulic_headbox_slice_jet_to_wire_ratio:mean5m"
        expr: "avg_over_time(paper_kraft_di_hydraulic_headbox_slice_jet_to_wire_ratio[5m])"
        labels:
          subsystem: "DilutionWaterProfiler"
          standard: "TAPPI-T236-ISO-536-PAPTAC-QCS-2026"
      - alert: "DilutionWaterProfilerMahalanobisExcursionHigh"
        expr: "paper_kraft_di_hydraulic_headbox_slice_mahalanobis_score > 3.5"
        for: "15s"
        labels:
          severity: "warning"
          subsystem: "DilutionWaterProfiler"
        annotations:
          summary: "DilutionWaterProfiler anomaly score exceeded 3.5 sigma"
          description: "Metric jet_to_wire_ratio drifted from baseline 1.02 (tol 0.004)."
      - alert: "DilutionWaterProfilerSafetyInterlockLatched"
        expr: "paper_kraft_di_hydraulic_headbox_slice_interlock_latched == 1"
        for: "1s"
        labels:
          severity: "critical"
          subsystem: "DilutionWaterProfiler"
        annotations:
          summary: "CRITICAL: DilutionWaterProfiler safety interlock tripped"
          description: "Immediate closed-loop damping actuated on hydraulic_headbox_slice."
  - name: "paper_kraft_digester_fourdrinier_web_tension_fourdrinier_vacuum_foil_rules"
    interval: "5s"
    rules:
      - record: "facility:fourdrinier_vacuum_foil_first_pass_retention_pct:mean5m"
        expr: "avg_over_time(paper_kraft_di_fourdrinier_vacuum_foil_first_pass_retention_pct[5m])"
        labels:
          subsystem: "FormingBoardWaterLine"
          standard: "TAPPI-T236-ISO-536-PAPTAC-QCS-2026"
      - alert: "FormingBoardWaterLineMahalanobisExcursionHigh"
        expr: "paper_kraft_di_fourdrinier_vacuum_foil_mahalanobis_score > 3.5"
        for: "15s"
        labels:
          severity: "warning"
          subsystem: "FormingBoardWaterLine"
        annotations:
          summary: "FormingBoardWaterLine anomaly score exceeded 3.5 sigma"
          description: "Metric first_pass_retention_pct drifted from baseline 82.4 (tol 0.45)."
      - alert: "FormingBoardWaterLineSafetyInterlockLatched"
        expr: "paper_kraft_di_fourdrinier_vacuum_foil_interlock_latched == 1"
        for: "1s"
        labels:
          severity: "critical"
          subsystem: "FormingBoardWaterLine"
        annotations:
          summary: "CRITICAL: FormingBoardWaterLine safety interlock tripped"
          description: "Immediate closed-loop damping actuated on fourdrinier_vacuum_foil."
  - name: "paper_kraft_digester_fourdrinier_web_tension_shoe_press_impulse_nip_rules"
    interval: "5s"
    rules:
      - record: "facility:shoe_press_impulse_nip_couch_solids_dryness_pct:mean5m"
        expr: "avg_over_time(paper_kraft_di_shoe_press_impulse_nip_couch_solids_dryness_pct[5m])"
        labels:
          subsystem: "ExtendedNipFeltPress"
          standard: "TAPPI-T236-ISO-536-PAPTAC-QCS-2026"
      - alert: "ExtendedNipFeltPressMahalanobisExcursionHigh"
        expr: "paper_kraft_di_shoe_press_impulse_nip_mahalanobis_score > 3.5"
        for: "15s"
        labels:
          severity: "warning"
          subsystem: "ExtendedNipFeltPress"
        annotations:
          summary: "ExtendedNipFeltPress anomaly score exceeded 3.5 sigma"
          description: "Metric couch_solids_dryness_pct drifted from baseline 48.5 (tol 0.4)."
      - alert: "ExtendedNipFeltPressSafetyInterlockLatched"
        expr: "paper_kraft_di_shoe_press_impulse_nip_interlock_latched == 1"
        
        for: "1s"
        labels:
          severity: "critical"
          