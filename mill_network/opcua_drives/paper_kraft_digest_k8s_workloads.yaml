# Kubernetes Topology: Kraft Pulp Kamyr Digester H-Factor Kappa Control, Fourdrinier We
apiVersion: v1
kind: Namespace
metadata:
  name: "paper-kraft-digester-fourdrinier-web-tension-prod"
  labels:
    standard: "TAPPI-T236-ISO-536-PAPTAC-QCS-2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "kamyr-continuous-digest-worker"
  namespace: "paper-kraft-digester-fourdrinier-web-tension-prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "kamyr-continuous-digest-worker"
  template:
    metadata:
      labels:
        app: "kamyr-continuous-digest-worker"
        subsystem: "IsothermalCookingZone"
    spec:
      containers:
        - name: "kamyr-continuous-digest-worker"
          image: "registry.local/paper_kraft_dige/kamyr-continuous-digest-worker:2026.4"
          ports:
            - containerPort: 8101
          env:
            - name: "NOMINAL_SETPOINT"
              value: "24.5"
            - name: "NOMINAL_TOLERANCE"
              value: "0.35"
            - name: "PRIMARY_METRIC_NAME"
              value: "vroom_h_factor_accum"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "hydraulic-headbox-slice-worker"
  namespace: "paper-kraft-digester-fourdrinier-web-tension-prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "hydraulic-headbox-slice-worker"
  template:
    metadata:
      labels:
        app: "hydraulic-headbox-slice-worker"
        subsystem: "DilutionWaterProfiler"
    spec:
      containers:
        - name: "hydraulic-headbox-slice-worker"
          image: "registry.local/paper_kraft_dige/hydraulic-headbox-slice-worker:2026.4"
          ports:
            - containerPort: 8102
          env:
            - name: "NOMINAL_SETPOINT"
              value: "1.02"
            - name: "NOMINAL_TOLERANCE"
              value: "0.004"
            - name: "PRIMARY_METRIC_NAME"
              value: "jet_to_wire_ratio"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "fourdrinier-vacuum-foil-worker"
  namespace: "paper-kraft-digester-fourdrinier-web-tension-prod"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "fourdrinier-vacuum-foil-worker"
  template:
    metadata:
      labels:
        app: "fourdrinier-vacuum-foil-worker"
        subsystem: "FormingBoardWaterLine"
    spec:
      containers:
        - name: "fourdrinier-vacuum-foil-worker"
          image: "registry.local/paper_kraft_dige/fourdrinier-vacuum-foil-worker:2026.4"
          ports:
            - containerPort: 8103
          env:
            - name: "NOMINAL_SETPOINT"
              value: "82.4"
            - name: "NOMINAL_TOLERANCE"
              value: "0.45"
            - name: "PRIMARY_METRIC_NAME"
              value: "first_pass_retention_pct"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: apps/v1
