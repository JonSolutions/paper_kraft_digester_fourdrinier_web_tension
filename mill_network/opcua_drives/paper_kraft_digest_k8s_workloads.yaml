        - name: "shoe-press-impulse-nip-worker"
          image: "registry.local/paper_kraft_dige/shoe-press-impulse-nip-worker:2026.4"
          ports:
            - containerPort: 8104
          env:
            - name: "NOMINAL_SETPOINT"
              value: "48.5"
            - name: "NOMINAL_TOLERANCE"
              value: "0.4"
            - name: "PRIMARY_METRIC_NAME"
              value: "couch_solids_dryness_pct"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "sectional-draw-tension-worker"
